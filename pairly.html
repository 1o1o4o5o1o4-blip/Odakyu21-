<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pairly | Connect with Everything</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root {
            --p-v: #6366f1; /* Pairly Violet */
            --bg: #dae0e6; --card: #ffffff;
            --text: #1c1c1c; --meta: #787c7e; --border: #ccc;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #030303; --card: #1a1a1b; --text: #d7dadc; --meta: #818384; --border: #343536; }
        }
        body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); margin: 0; color: var(--text); }
        header { background: var(--card); padding: 10px 40px; display: flex; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
        .logo { font-size: 24px; font-weight: 900; color: var(--p-v); text-decoration: none; font-style: italic; }
        
        .main-layout { max-width: 960px; margin: 20px auto; display: grid; grid-template-columns: 1fr 312px; gap: 24px; padding: 0 16px; }
        @media (max-width: 800px) { .main-layout { grid-template-columns: 1fr; } .sidebar { display: none; } }

        .create-bar { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
        .create-input { background: #f6f7f8; border: 1px solid #edeff1; border-radius: 4px; flex: 1; padding: 10px; color: var(--meta); text-decoration: none; font-size: 14px; }

        .post { background: var(--card); border: 1px solid var(--border); border-radius: 4px; display: flex; margin-bottom: 12px; cursor: pointer; transition: border 0.1s; overflow: hidden; }
        .post:hover { border-color: #898989; }
        .votes { background: rgba(0,0,0,0.02); width: 40px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; font-weight: bold; }
        .content { padding: 12px; flex: 1; min-width: 0; }
        .meta { font-size: 12px; color: var(--meta); margin-bottom: 8px; display: flex; gap: 6px; }
        .title { font-size: 18px; font-weight: 600; margin: 0 0 10px; line-height: 1.2; word-wrap: break-word; }
        .body-preview { font-size: 14px; line-height: 1.6; max-height: 250px; overflow: hidden; mask-image: linear-gradient(180deg,#000 60%,transparent); margin-bottom: 12px; }
        .body-preview img { max-width: 100%; border-radius: 4px; margin: 8px 0; }
        
        .footer { display: flex; gap: 15px; font-size: 12px; font-weight: bold; color: var(--meta); }
        .sidebar { position: sticky; top: 70px; height: fit-content; }
        .side-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 12px; }
        .btn-p { display: block; background: var(--p-v); color: white; text-align: center; text-decoration: none; padding: 10px; border-radius: 20px; font-weight: bold; margin-top: 10px; }
        .shimmer { animation: shine 1.5s infinite linear; background: linear-gradient(90deg, var(--border) 0%, var(--bg) 50%, var(--border) 100%); background-size: 200% 100%; height: 100px; border-radius: 4px; margin-bottom: 10px; }
        @keyframes shine { to { background-position: 200% 0; } }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">Pairly</a>
</header>

<div class="main-layout">
    <main>
        <div class="create-bar">
            <div style="width:38px; height:38px; border-radius:50%; background:var(--p-v);"></div>
            <a href="https://github.com" target="_blank" class="create-input">Pairly に新しく投稿する</a>
        </div>
        <div id="feed">
            <div class="shimmer"></div><div class="shimmer"></div>
        </div>
    </main>

    <aside class="sidebar">
        <div class="side-card">
            <div style="height:34px; background:var(--p-v); margin:-12px -12px 12px -12px; border-radius:4px 4px 0 0;"></div>
            <h3 style="margin:0;">r/Pairly</h3>
            <p style="font-size:14px; color:var(--meta);">Pairly は Scratchers のための次世代掲示板です。自由に考えをシェアしましょう。</p>
            <div style="border-top:1px solid var(--border); padding-top:10px;">
                <b>2.5k</b> Members <br> <b>64</b> Online
            </div>
            <a href="https://github.com" target="_blank" class="btn-p">コミュニティに参加 / 投稿</a>
        </div>
    </aside>
</div>

<script>
    async function loadPairly() {
        const repo = "1o1o4o5o1o4-blip/Odakyu21-";
        // 100%規制を回避するためのダイナミックパラメータ
        const url = `https://api.github.com{repo}/issues?state=all&sort=created&direction=desc&_=${Date.now()}`;
        
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("API Limit");
            const data = await res.json();
            const feed = document.getElementById('feed');
            
            feed.innerHTML = data.length ? data.map(item => `
                <div class="post" onclick="window.open('${item.html_url}', '_blank')">
                    <div class="votes">
                        <span style="color:#ff4500">▲</span>
                        <div style="margin:4px 0;">${item.comments + Math.floor(Math.random()*10)}</div>
                        <span style="color:#7193ff">▼</span>
                    </div>
                    <div class="content">
                        <div class="meta">
                            <span style="color:var(--text); font-weight:bold;">p/scratch</span>
                            <span>• Posted by u/${item.user.login}</span>
                            <span>${new Date(item.created_at).toLocaleDateString()}</span>
                        </div>
                        <h2 class="title">${item.title}</h2>
                        <div class="body-preview">${marked.parse(item.body || '')}</div>
                        <div class="footer">
                            <span>💬 ${item.comments} Comments</span>
                            <span>💎 Award</span>
                            <span>📤 Share</span>
                            <span>🏳️ Report</span>
                        </div>
                    </div>
                </div>
            `).join('') : '<p style="text-align:center;">No posts yet.</p>';
        } catch (e) {
            document.getElementById('feed').innerHTML = `<p style="color:#ff4500; text-align:center; padding:50px;">
                <b>⚠️ Connection Overload</b><br>GitHub APIの制限を超えました。1分後にリロードしてください。</p>`;
        }
    }
    loadPairly();
</script>

</body>
</html>
